ível: prosseguir com as demais seções, médias nulas onde não houver amostra e avisos explícitos.</text><text x="100" y="1326" font-family="Arial" font-size="16" fill="#27424d">Linha contínua: sequência interna. Linha tracejada: consulta ao fornecedor. BPMN descritivo, não executável.</text></svg>